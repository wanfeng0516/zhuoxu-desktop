name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -Raw -Encoding UTF8 package.json | ConvertFrom-Json).version
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match package.json version $packageVersion"
          }

      - name: Build release files
        run: npm run release:prepare

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZhuoXu-Windows-x64
          path: |
            release/ZhuoXu-Setup-*-x64.exe
            release/ZhuoXu-Setup-*-x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/ZhuoXu-Setup-*-x64.exe
            release/ZhuoXu-Setup-*-x64.zip
            release/SHA256SUMS.txt
